name: Build wheels

on:
  workflow_dispatch:

  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build_wheels:
    name: Build wheel ${{ matrix.python }}-${{ matrix.buildplat[1] }} on ${{ matrix.buildplat[0] }}
    runs-on: ${{ matrix.buildplat[0] }}

    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ubuntu-22.04, manylinux_x86_64]
          - [ubuntu-22.04, musllinux_x86_64]
          - [ubuntu-22.04-arm, manylinux_aarch64]
          - [ubuntu-22.04-arm, musllinux_aarch64]
          - [macos-15-intel, macosx_x86_64]
          - [macos-14, macosx_arm64]
          - [windows-2022, win_amd64]
          - [windows-11-arm, win_arm64]
          # - [windows-2022, win32]
        python: ["cp312"]

    steps:
      - name: Checkout openpiv
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          
      - name: Set up 32-bit MinGW
        if: ${{ runner.os == 'Windows' && matrix.buildplat[1] == 'win32' }}
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63 # v3
        with:
          platform: x86
          
      - name: Deduplicate meson-python macOS RPATHs
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/openpiv-tools"
          mkdir -p "$tool_dir"

          cat > "$tool_dir/install_name_tool" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          real_tool=/usr/bin/install_name_tool

          if [[ $# -eq 4 && $1 == "-rpath" ]]; then
            old_rpath=$2
            new_rpath=$3
            binary=$4
            load_commands=$(/usr/bin/otool -l "$binary")

            if /usr/bin/grep -Fq -- \
              "path $new_rpath (offset" <<< "$load_commands"; then
              exec "$real_tool" \
                -delete_rpath "$old_rpath" "$binary"
            fi
          fi

          exec "$real_tool" "$@"
          SH

          chmod +x "$tool_dir/install_name_tool"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Build wheels - Windows ARM64 (MSVC)
        if: ${{ runner.os == 'Windows' && matrix.buildplat[1] == 'win_arm64' }}
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          CIBW_CONFIG_SETTINGS_WINDOWS: "setup-args=--vsenv"

      - name: Build wheels
        if: ${{ !(runner.os == 'Windows' && matrix.buildplat[1] == 'win_arm64') }}
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}

      # - name: Upload wheel
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
      #     path: ./wheelhouse/*.whl
      #     if-no-files-found: error

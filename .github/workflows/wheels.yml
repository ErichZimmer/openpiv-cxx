name: Build wheels

on:
  # Manually trigger build
  workflow_dispatch:

  # Trigger on pushes to the mainline branches and version tags. This prevents building commits
  # twice when the pull request source branch is in the same repository.
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
      types: [opened, labeled, reopened, synchronize]

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.buildplat[0] }}, Python ${{ matrix.pyver }}
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build_wheels') || github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.buildplat[0] }}
   
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        # borrowed from NumPy
        buildplat:
        - [ubuntu-20.04, manylinux_x86_64]
        - [macos-13, macosx_*]
        - [windows-2019, win_amd64]
        pyver: ["cp310", "cp311", "cp312", "cp313"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          
      - name: win_amd64 - install rtools
        run: |
          # mingw-w64
          choco install rtools --no-progress
          echo "c:\rtools40\ucrt64\bin;" >> $env:GITHUB_PATH
        if: ${{ runner.os == 'Windows' }}

      - name: Add custom path (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: echo "PATH=$GITHUB_WORKSPACE/builddir/openpiv:$PATH" >> $GITHUB_ENV

      - name: Add custom path (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: echo "$env:GITHUB_WORKSPACE\builddir\openpiv" >> $env:GITHUB_PATH

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16
        with:
          output-dir: wheelhouse
          config-file: pyproject.toml
        env:
          # Build for cpython >= 3.9.
          CIBW_BUILD: ${{ matrix.pyver }}-${{ matrix.buildplat[1] }}
          
          # setup environment
          CIBW_ARCHS_WINDOWS: auto64
          MACOSX_DEPLOYMENT_TARGET: "10.14"
          CIBW_BUILD_FRONTEND: "build"

      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build_wheels') || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v3.0.2
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v4
        name: Install Python
        with:
          python-version: '3.12'

      - name: Install build requirements
        run: python3 -m pip install cmake ninja setuptools scikit-build numpy imageio --upgrade --progress-bar=off

      - name: Build sdist
        run: python setup.py sdist

      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/*.tar.gz

  upload_pypi:
    name: Publish [PyPI]
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist

      - name: Check files
        run: ls -lR dist
